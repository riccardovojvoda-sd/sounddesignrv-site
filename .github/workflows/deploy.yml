name: Build e deploy sounddesignrv.com

# Costruisce il sito con Eleventy e lo pubblica su GitHub Pages.
# Parte a ogni push su main, a mano, e due volte al giorno (07:00 e 17:00 UTC): la build programmata fa comparire
# da sola gli Approfondimenti con data raggiunta (vedi lib/articoli.js). Il dominio custom viene dal file CNAME in _site.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7,17 * * *"
  workflow_dispatch:

permissions:
  contents: write   # serve allo script uscita-di-riserva per il commit della nuova data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Uscita di riserva (solo alla build programmata dell'ora di uscita)
        # Se l'articolo di oggi non è pronto, anticipa a oggi il primo articolo pronto (regola del 02/10/2026).
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" -lt 12 ]; then
            node scripts/uscita-di-riserva.js --cartelle src/guide,src/en/insights,src/fr/guides --ora 07:00
          fi
      - run: npm run build
      - name: Controllo pre-pubblicazione
        run: |
          ! grep -rl "@gmail.com" _site --include=*.html
          ! grep -rl "squarespace" _site --include=*.html
          for f in _site/progetti/*/index.html _site/*/projects/*/index.html _site/*/projets/*/index.html; do grep -q 'class="video' "$f" || { echo "Scheda senza video: $f"; exit 1; }; done
          test -f _site/index.html && test -f _site/404.html && test -f _site/CNAME
          test -f _site/portfolio/index.html && test -f _site/s/Riccardo-Vojvoda-Sound-Designer-Profile_2026_ITA.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
