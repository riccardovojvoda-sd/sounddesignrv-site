name: Build e deploy sounddesignrv.com

# Costruisce il sito con Eleventy e lo carica su Infomaniak via FTP.
# Parte a ogni push su main, o a mano. Il mirror e' completo (con --delete):
# la web root del hosting e' interamente governata da questo repo.
#
# Secret richiesti (gh secret set): FTP_HOST, FTP_USER, FTP_PASS, FTP_DIR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_CONFIGURATO: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Controllo pre-pubblicazione
        run: |
          ! grep -rl "@gmail.com" _site --include=*.html
          ! grep -rl "squarespace" _site --include=*.html
          for f in _site/progetti/*/index.html; do grep -q 'class="video' "$f" || { echo "Scheda senza video: $f"; exit 1; }; done
          test -f _site/index.html && test -f _site/.htaccess
      - name: Installa lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload via FTP
        if: ${{ env.FTP_CONFIGURATO != '' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 15;
            set net:connection-limit 2;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror -R --delete --only-newer --verbose --parallel=2 \
              --exclude-glob .DS_Store \
              _site/ '$FTP_DIR'
          "
